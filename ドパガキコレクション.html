<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ドパガキコレクション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#ff7a18; --orange-d:#e85d00; --pink:#ff5ea8; --green:#34c759;
    --sky:#7ec8e3; --ground:#8ed94b; --panel:#ffffff; --ink:#2b2b2b;
    --shadow:0 6px 0 rgba(0,0,0,.12), 0 10px 24px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f3;
    font-family:"DotGothic16","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    color:var(--ink);}
  button,input,select,textarea{font-family:inherit;}
  #app{position:fixed;inset:0;overflow:hidden;}
  canvas{display:block;}

  /* 画面共通 */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;}
  .screen.active{display:flex;}

  /* ===== タイトル ===== */
  #titleScreen{background:linear-gradient(180deg,#8fd3ec 0%, #bfe9f7 60%, #d7f3ff 100%);
    align-items:center;justify-content:flex-start;padding:6vh 18px 24px;}
  #titleLogo{width:min(86vw,520px);margin-top:4vh;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));
    animation:floaty 3.2s ease-in-out infinite;}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .title-card{width:min(92vw,440px);background:rgba(255,255,255,.92);border-radius:26px;
    padding:22px 20px 24px;box-shadow:var(--shadow);margin-top:3vh;border:3px solid #fff;}
  .title-card p{margin:0 0 16px;text-align:center;font-weight:700;line-height:1.7;color:#3a3a3a;}
  .name-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px;}
  .name-row input{flex:1;min-width:0;font-size:20px;font-weight:700;padding:12px 14px;border-radius:14px;
    border:3px solid var(--orange);outline:none;background:#fff;text-align:center;}
  .name-row .suffix{font-size:24px;font-weight:800;}
  .name-row select{font-size:16px;font-weight:700;padding:10px 6px;border-radius:12px;border:3px solid var(--orange);
    background:#f3f3f3;}
  .btn{border:none;border-radius:16px;font-weight:800;color:#fff;cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .05s, box-shadow .05s;
    font-family:inherit;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .btn-org{background:linear-gradient(180deg,#ff9a3c,#ff7a18);}
  .btn-grn{background:linear-gradient(180deg,#4cd964,#34c759);}
  .btn-gray{background:linear-gradient(180deg,#bdbdbd,#9e9e9e);}
  .btn-red{background:linear-gradient(180deg,#ff6b5e,#e8412f);}
  .btn-pink{background:linear-gradient(180deg,#ff7ab8,#ff4f9e);}
  .btn-lg{font-size:22px;padding:16px 18px;width:100%;}
  .btn-sm{font-size:15px;padding:10px 14px;}
  #continueBtn{margin-top:14px;width:min(72vw,320px);}

  /* ===== HUD（島画面） ===== */
  #hud{position:absolute;inset:0;pointer-events:none;}
  #hud > *{pointer-events:auto;}
  .island-info{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;}
  .info-pill{background:rgba(255,255,255,.92);border-radius:16px;padding:10px 16px;
    box-shadow:var(--shadow);font-weight:800;border:2px solid #fff;}
  .info-pill.name{color:var(--orange-d);font-size:20px;}
  .info-pill.gold{color:#caa12a;display:flex;align-items:center;gap:8px;font-size:18px;}
  .coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#e3b81e);
    border:2px solid #c89a16;display:inline-block;}
  .top-right{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
  .round-ico{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}

  /* ツールバー */
  #toolbar{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(247,247,225,.92);
    border-radius:22px;padding:14px 12px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;
    gap:10px;justify-content:center;}
  .tool{width:84px;min-height:78px;border-radius:16px;background:#fff;border:3px solid var(--orange);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;
    font-weight:800;font-size:14px;color:#3a3a3a;position:relative;line-height:1.2;text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .05s;}
  .tool:active{transform:translateY(2px);}
  .tool .emo{font-size:22px;}
  .tool.active{background:linear-gradient(180deg,#ff9a3c,#ff7a18);color:#fff;}
  .tool .new{position:absolute;top:-8px;right:-8px;background:var(--pink);color:#fff;font-size:11px;
    padding:2px 7px;border-radius:10px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.2);}
  .tool.locked{opacity:.45;filter:grayscale(.4);}

  /* 視点スティック */
  #camStick{position:absolute;right:24px;bottom:170px;width:150px;height:150px;border-radius:50%;
    background:rgba(180,230,120,.5);box-shadow:inset 0 0 0 3px rgba(255,255,255,.5);touch-action:none;
    display:flex;align-items:center;justify-content:center;}
  #camStick .label{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-weight:800;
    color:#3a3a3a;white-space:nowrap;text-shadow:0 1px 2px #fff;}
  #camKnob{width:62px;height:62px;border-radius:50%;background:linear-gradient(180deg,#ff9a3c,#ff7a18);
    box-shadow:0 4px 10px rgba(0,0,0,.25), inset 0 2px 4px rgba(255,255,255,.4);pointer-events:none;}
  #zoomBtns{position:absolute;right:30px;bottom:330px;display:flex;flex-direction:column;gap:10px;}
  .zoom-b{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);
    font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#444;}

  /* ===== キャラメイク ===== */
  #makerScreen{background:#dff3fb;}
  #makerPreviewWrap{position:absolute;left:0;right:0;top:0;height:46%;}
  #makerTopBar{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;
    padding:0 14px;z-index:5;}
  #makerPanel{position:absolute;left:0;right:0;bottom:0;height:54%;background:#eef7fd;
    border-top-left-radius:26px;border-top-right-radius:26px;box-shadow:0 -6px 20px rgba(0,0,0,.12);
    display:flex;flex-direction:column;}
  #makerScroll{flex:1;overflow-y:auto;padding:18px 16px 8px;-webkit-overflow-scrolling:touch;}
  #makerScroll::-webkit-scrollbar{width:0;}
  .field{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .field h3{margin:0 0 12px;font-size:17px;border-bottom:3px solid var(--orange);display:inline-block;padding-bottom:2px;}
  .field input[type=text]{width:100%;font-size:18px;font-weight:700;padding:12px 14px;border-radius:12px;
    border:2px solid #ddd;outline:none;}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:42px;height:42px;border-radius:50%;border:3px solid #ddd;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.12);}
  .sw.sel{border-color:var(--orange);transform:scale(1.06);}
  .swpick{width:42px;height:42px;border-radius:50%;border:3px solid #bbb;padding:0;cursor:pointer;background:#fff;
    -webkit-appearance:none;appearance:none;}
  .swpick::-webkit-color-swatch-wrapper{padding:2px;}
  .swpick::-webkit-color-swatch{border:none;border-radius:50%;}
  .swpick::-moz-color-swatch{border:none;border-radius:50%;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:10px 16px;border-radius:14px;border:2px solid #ddd;background:#fff;font-weight:800;cursor:pointer;font-size:15px;}
  .chip.sel{border-color:var(--orange);background:#fff3e8;color:var(--orange-d);}
  #makerFooter{display:flex;gap:12px;padding:10px 16px calc(14px + env(safe-area-inset-bottom));}
  #makerFooter .btn{flex:1;}
  .mbti-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .mbti-badge{font-size:18px;font-weight:900;color:var(--orange-d);}

  /* ===== 住人アップ画面（食べ物・服を与える） ===== */
  #careScreen{background:linear-gradient(180deg,#8fd3ec,#cdeefb);}
  #carePreviewWrap{position:absolute;left:0;right:0;top:0;height:48%;}
  #carePanel{position:absolute;left:0;right:0;bottom:0;height:52%;background:#fff;
    border-top-left-radius:26px;border-top-right-radius:26px;box-shadow:0 -6px 20px rgba(0,0,0,.12);
    display:flex;flex-direction:column;padding:16px 16px calc(10px + env(safe-area-inset-bottom));}
  .care-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .care-name{font-size:18px;font-weight:900;white-space:nowrap;}
  .happy-wrap{flex:1;}
  .happy-label{font-size:13px;font-weight:800;color:var(--orange-d);text-align:center;margin-bottom:4px;}
  .happy-bar{height:18px;background:#eee;border-radius:10px;overflow:hidden;}
  .happy-fill{height:100%;background:linear-gradient(90deg,#ffb347,#ff7a18);width:0%;transition:width .4s;}
  .care-tabs{display:flex;gap:10px;margin-bottom:10px;}
  .care-tab{flex:1;padding:10px 4px;border-radius:14px;background:#f0f0f0;font-weight:800;font-size:13px;text-align:center;cursor:pointer;border:2px solid transparent;}
  .care-tab.sel{background:linear-gradient(180deg,#ff9a3c,#ff7a18);color:#fff;}
  .care-msg{background:#fff6ec;border:2px solid #ffd9b0;border-radius:14px;padding:12px 14px;
    font-weight:700;color:var(--orange-d);min-height:54px;margin-bottom:10px;line-height:1.5;font-size:15px;display:flex;align-items:center;}
  .shop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;overflow-y:auto;flex:1;padding-bottom:6px;}
  .shop-item{background:#fff;border:2px solid #eee;border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .shop-item:active{transform:scale(.96);}
  .shop-item .img{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:34px;}
  .shop-item .nm{font-weight:800;font-size:12px;margin-top:2px;}
  .shop-item .pr{font-size:12px;color:#e8412f;font-weight:800;display:flex;align-items:center;justify-content:center;gap:3px;}
  .mini-coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#e3b81e);border:1px solid #c89a16;display:inline-block;}

  /* ===== 家の中 ===== */
  #houseScreen{background:#3a2e2a;}
  #houseInner{position:absolute;inset:0;}
  #houseBack{position:absolute;top:16px;left:16px;z-index:5;}

  /* トースト・吹き出し・モーダル */
  #toast{position:absolute;left:50%;top:18%;transform:translateX(-50%) translateY(-20px);
    background:rgba(0,0,0,.82);color:#fff;font-weight:800;padding:14px 22px;border-radius:16px;
    opacity:0;transition:opacity .25s, transform .25s;z-index:50;pointer-events:none;font-size:16px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;}
  .modal.show{display:flex;}
  .modal-card{background:#fff;border-radius:22px;padding:24px;width:min(86vw,360px);text-align:center;box-shadow:var(--shadow);}
  .modal-card p{font-weight:800;font-size:17px;line-height:1.6;margin:0 0 18px;}
  .modal-card .row{display:flex;gap:12px;}
  .modal-card .row .btn{flex:1;}
  .shop-opts{display:flex;flex-direction:column;gap:10px;}
  .shop-opt.locked{opacity:.5;filter:grayscale(.45);}
  #hint{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(40,44,52,.92);
    color:#fff;font-weight:800;padding:12px 18px;border-radius:16px;z-index:40;display:none;text-align:center;}
  #hint .btn{margin-top:10px;}
  #saveBurst{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:55;pointer-events:none;}
  #saveBurst .b{background:rgba(52,199,89,.95);color:#fff;font-weight:900;font-size:22px;padding:18px 28px;border-radius:20px;
    box-shadow:var(--shadow);animation:pop .6s ease;}
  @keyframes pop{0%{transform:scale(.5);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}

  /* キャラ会話吹き出し（3D上に重ねる） */
  .bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;border:2px solid var(--orange);
    color:#333;font-weight:700;font-size:13px;padding:7px 12px;border-radius:14px;white-space:nowrap;
    box-shadow:0 3px 8px rgba(0,0,0,.18);pointer-events:none;z-index:20;}
  .bubble:after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);
    border:7px solid transparent;border-top-color:#fff;}
  .mark{position:absolute;transform:translate(-50%,-100%);font-size:26px;pointer-events:none;z-index:20;
    animation:bob .6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,-130%)}}
  /* 住人の頭上に出すレベルバッジ */
  .lvbadge{position:absolute;transform:translate(-50%,-50%);background:linear-gradient(180deg,#ffd86b,#ffb300);
    color:#5a3b00;font-weight:900;font-size:12px;padding:2px 9px;border-radius:11px;border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,.25);pointer-events:none;z-index:18;white-space:nowrap;}
  /* レベルアップ演出 */
  #lvBurst{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:56;pointer-events:none;}
  #lvBurst .b{background:linear-gradient(180deg,#ffd86b,#ff9a3c);color:#5a3b00;font-weight:900;font-size:24px;
    padding:18px 30px;border-radius:22px;box-shadow:var(--shadow);animation:pop .6s ease;text-align:center;line-height:1.4;}
</style>
</head>
<body>
<div id="app">

  <!-- タイトル -->
  <section id="titleScreen" class="screen active">
    <img id="titleLogo" alt="ドパガキコレクション">
    <div class="title-card">
      <p>ここは名前の無い島です。<br>あなたが名前をつけてください。</p>
      <div class="name-row">
        <input id="islandNameInput" type="text" placeholder="名前" maxlength="8">
        <span class="suffix">島</span>
        <select id="islandYomi">
          <option value="しま">しま</option>
          <option value="じま">じま</option>
          <option value="とう">とう</option>
        </select>
      </div>
      <button class="btn btn-org btn-lg" id="decideIslandBtn">決定！</button>
    </div>
    <button class="btn btn-grn btn-lg" id="continueBtn">続きから遊ぶ</button>
  </section>

  <!-- 島メイン -->
  <section id="islandScreen" class="screen">
    <div id="islandCanvasWrap" style="position:absolute;inset:0;"></div>
    <div id="hud">
      <div class="island-info">
        <div class="info-pill name" id="hudIslandName">しま</div>
        <div class="info-pill gold"><span class="coin"></span><span id="hudGold">0</span> G</div>
      </div>
      <div class="top-right">
        <button class="btn btn-org btn-sm" id="saveBtn">セーブ</button>
        <button class="btn btn-red btn-sm" id="quitBtn">終了</button>
      </div>

      <div id="camStick"><div class="label">視点カメラ</div><div id="camKnob"></div></div>
      <div id="zoomBtns">
        <div class="zoom-b" id="zoomIn">＋</div>
        <div class="zoom-b" id="zoomOut">−</div>
      </div>

      <div id="toolbar">
        <div class="tool active" data-mode="move"><span class="emo">👆</span>住人<br>移動</div>
        <div class="tool" data-mode="tree"><span class="emo">🌲</span>木を<br>置く</div>
        <div class="tool" data-mode="house"><span class="emo">🏠</span>家を<br>置く</div>
        <div class="tool" data-mode="shop"><span class="emo">🏪</span>店を<br>置く<span class="new" id="shopNew" style="display:none">NEW</span></div>
        <div class="tool" data-mode="addResident"><span class="emo">➕</span>住人<br>追加</div>
      </div>
      <div id="hint"></div>
    </div>
  </section>

  <!-- キャラメイク -->
  <section id="makerScreen" class="screen">
    <div id="makerPreviewWrap"></div>
    <div id="makerTopBar"><div></div></div>
    <div id="makerPanel">
      <div id="makerScroll">
        <div class="field"><h3>名前</h3>
          <input id="charName" type="text" placeholder="ドパガキの名前" maxlength="8"></div>
        <div class="field"><h3>性格（MBTI）</h3>
          <div class="mbti-row">
            <span class="mbti-badge" id="mbtiBadge">ーー</span>
            <button class="btn btn-pink btn-sm" id="mbtiDiagBtn">簡易診断する</button>
            <select id="mbtiSelect"></select>
          </div>
          <div id="mbtiCatch" style="margin-top:8px;font-weight:700;color:#666;font-size:14px;"></div>
        </div>
        <div class="field"><h3>服の色</h3><div class="swatches" id="swClothes"></div></div>
        <div class="field"><h3>ボトムス</h3>
          <div class="chips" id="bottomType"></div>
          <div class="swatches" id="swBottom" style="margin-top:12px;"></div>
        </div>
        <div class="field"><h3>肌の色</h3><div class="swatches" id="swSkin"></div></div>
        <div class="field"><h3>ほっぺの色</h3><div class="swatches" id="swCheek"></div></div>
        <div class="field"><h3>髪型</h3><div class="chips" id="hairStyle"></div></div>
        <div class="field"><h3>髪の色</h3><div class="swatches" id="swHair"></div></div>
        <div class="field"><h3>目の形</h3><div class="chips" id="eyeShape"></div></div>
        <div class="field"><h3>目の色</h3><div class="swatches" id="swEye"></div></div>
        <div class="field"><h3>鼻の形</h3><div class="chips" id="noseShape"></div></div>
        <div class="field"><h3>口の形</h3><div class="chips" id="mouthShape"></div></div>
      </div>
      <div id="makerFooter">
        <button class="btn btn-gray" id="makerCancel">やめる</button>
        <button class="btn btn-org" id="makerConfirm">島に呼ぶ！</button>
      </div>
    </div>
  </section>

  <!-- 住人アップ（ケア） -->
  <section id="careScreen" class="screen">
    <div id="carePreviewWrap"></div>
    <div id="carePanel">
      <div class="care-head">
        <div class="care-name" id="careName">ーー</div>
        <div class="happy-wrap">
          <div class="happy-label">幸せ <span id="happyNum">0</span>/100</div>
          <div class="happy-bar"><div class="happy-fill" id="happyFill"></div></div>
        </div>
        <button class="btn btn-gray btn-sm" id="careBack">戻る</button>
      </div>
      <div class="care-tabs">
        <div class="care-tab sel" data-tab="food">🍔 食べ物</div>
        <div class="care-tab" data-tab="cloth">👕 服</div>
        <div class="care-tab" data-tab="present">🎁 プレゼント</div>
      </div>
      <div class="care-msg" id="careMsg">何をあげる？</div>
      <div class="shop-grid" id="careGrid"></div>
    </div>
  </section>

  <!-- 家の中 -->
  <section id="houseScreen" class="screen">
    <div id="houseInner"></div>
    <button class="btn btn-gray btn-sm" id="houseBack">← 外に戻る</button>
  </section>

  <!-- 共通オーバーレイ -->
  <div id="toast"></div>
  <div id="saveBurst"><div class="b">💾 保存しました！</div></div>
  <div id="lvBurst"><div class="b">🎉 レベルアップ！</div></div>
  <div class="modal" id="shopMenu"><div class="modal-card">
    <p>どのお店を置く？</p>
    <div class="shop-opts">
      <button class="btn btn-org btn-lg shop-opt" data-mode="shopFood">🍔 食べ物屋</button>
      <button class="btn btn-org btn-lg shop-opt locked" data-mode="shopCloth" id="optCloth">👕 服屋</button>
      <button class="btn btn-org btn-lg shop-opt locked" data-mode="present" id="optPresent">🎁 プレゼント屋</button>
    </div>
    <button class="btn btn-gray btn-sm" id="shopCancel" style="margin-top:14px;">やめる</button>
  </div></div>
  <div class="modal" id="quitModal"><div class="modal-card">
    <p>ゲームを終了しますか？<br>（セーブ済みの内容は残ります）</p>
    <div class="row"><button class="btn btn-gray" id="quitNo">いいえ</button>
      <button class="btn btn-red" id="quitYes">終了する</button></div>
  </div></div>
  <div class="modal" id="diagModal"><div class="modal-card" style="text-align:left;">

/* =========================================================
   3Dキャラ生成（サンドボックス／Minecraft風・直方体プレイヤー）
   髪・瞳・顔・服はパーツではなくテクスチャ（塗り）で表現する。
   spec = {skin,hair,hairStyle,clothes,bottomType,bottomColor,eyeShape,eyeColor,nose,mouth}
   返り値: THREE.Group（足元が原点、上向き・前方=+Z）
   ========================================================= */
function buildCharacter(THREE, spec){
  const g = new THREE.Group();
  const hexc = c => (typeof c==='string') ? c : '#'+(((c>>>0)&0xffffff).toString(16).padStart(6,'0'));
  const adj = (hx,d)=>{ const n=parseInt(hx.slice(1),16); let r=(n>>16)&255,gg=(n>>8)&255,b=n&255;
    r=Math.max(0,Math.min(255,r+d)); gg=Math.max(0,Math.min(255,gg+d)); b=Math.max(0,Math.min(255,b+d));
    return '#'+((((r<<16)|(gg<<8)|b))>>>0).toString(16).padStart(6,'0'); };
  const SKIN=hexc(spec.skin), HAIR=hexc(spec.hair), EYEC=hexc(spec.eyeColor),
        CLO=hexc(spec.clothes), BOT=hexc(spec.bottomColor),
        CHEEK=hexc(spec.cheek!=null?spec.cheek:0xff9aa6), MOUTH='#9c3b3b', SHOE='#f2f2f2';
  const isSkirt = spec.bottomType==='スカート';

  // canvas→ピクセル風マテリアル（NearestFilterでドット感）
  function mk(draw,w,h){
    const cv=document.createElement('canvas'); cv.width=w||16; cv.height=h||16;
    const x=cv.getContext('2d'); x.imageSmoothingEnabled=false; draw(x,cv.width,cv.height);
    const t=new THREE.CanvasTexture(cv); t.magFilter=THREE.NearestFilter; t.minFilter=THREE.NearestFilter;
    return new THREE.MeshStandardMaterial({map:t, roughness:0.95, metalness:0});
  }
  const solid=(c,r=0.95)=>new THREE.MeshStandardMaterial({color:new THREE.Color(c), roughness:r});
  const F=(x,c,X,Y,W,H)=>{ x.fillStyle=c; x.fillRect(X,Y,W,H); };

  // 旧セーブの髪型名 → 新名称（髪型N）に正規化（ツインテールはロング=髪型2へ統合）
  const HAIRMAP={'ショート':'髪型1','ロング':'髪型2','ツインテール':'髪型2','ボブ':'髪型3',
                 'ポニーテール':'髪型4','アフロ':'髪型5','お団子':'髪型6','坊主':'髪型7'};
  const style = HAIRMAP[spec.hairStyle] || spec.hairStyle || '髪型1';
  const HP=(()=>{ switch(style){
    case '髪型2': return {bangs:20, side:true,  back:true,  body:0.80}; // ロング
    case '髪型3': return {bangs:24, side:true,  back:true,  body:0.18}; // ボブ
    case '髪型4': return {bangs:18, side:false, back:true,  body:0.50}; // ポニーテール
    case '髪型5': return {bangs:26, side:true,  back:true,  body:0.0};  // アフロ
    case '髪型6': return {bangs:18, side:false, back:true,  body:0.0};  // お団子
    case '髪型7': return {bangs:0,  side:false, back:false, body:0.0, none:true}; // 坊主
    default:      return {bangs:16, side:false, back:true,  body:0.0};  // 髪型1（ショート）
  }})();

  /* ===== 頭・前面（64x64・大きい目＆ほっぺ＆肌の陰影） ===== */
  function paintFront(x,w,h){
    F(x,SKIN,0,0,w,h);
    F(x,adj(SKIN,-14),0,0,8,h); F(x,adj(SKIN,-14),w-8,0,8,h);          // 輪郭の陰
    F(x,adj(SKIN,12),14,8,w-28,6);                                     // 額の明るみ
    if(HP.none) F(x,HAIR,0,0,w,8); else F(x,HAIR,0,0,w,HP.bangs);      // 前髪
    if(HP.side){ F(x,HAIR,0,0,8,Math.floor(h*0.72)); F(x,HAIR,w-8,0,8,Math.floor(h*0.72)); } // サイド
    const eyeW=16, eyeH=20, eyeY=28, lx=8, rx=w-8-eyeW, lash='#3a3340';
    function eye(ex,outer){
      F(x,'#ffffff',ex,eyeY,eyeW,eyeH);                                // 白目
      F(x,SKIN,ex,eyeY,2,2); F(x,SKIN,ex+eyeW-2,eyeY,2,2); F(x,SKIN,ex,eyeY+eyeH-2,2,2); F(x,SKIN,ex+eyeW-2,eyeY+eyeH-2,2,2); // 角丸
      let iy=eyeY+3, ih=eyeH-6;
      if(spec.eyeShape==='ジト目'){ F(x,SKIN,ex,eyeY,eyeW,6); iy=eyeY+9; ih=8; }
      else if(spec.eyeShape==='つり目'){ iy=eyeY+2; }
      else if(spec.eyeShape==='たれ目'){ iy=eyeY+5; }
      F(x,adj(EYEC,-35),ex+2,iy,eyeW-4,ih);                            // 虹彩の縁
      F(x,EYEC,ex+3,iy+1,eyeW-6,ih-3);                                 // 虹彩
      F(x,'#1a1620',ex+(eyeW>>1)-2,iy+(ih>>1)-1,4,4);                  // 瞳孔
      F(x,'#ffffff',ex+4,iy+2,4,4);                                    // 大ハイライト
      F(x,'#ffffff',ex+eyeW-7,iy+ih-5,2,2);                            // 小ハイライト
      F(x,lash,ex,eyeY-2,eyeW,3);                                      // 上まつげ
      if(spec.eyeShape==='つり目') F(x,lash,ex+(outer<0?-1:eyeW-2),eyeY-4,3,4);
      if(spec.eyeShape==='たれ目') F(x,lash,ex+(outer<0?-1:eyeW-2),eyeY+eyeH-3,3,4);
    }
    eye(lx,-1); eye(rx,1);
    x.globalAlpha=0.72; F(x,CHEEK,5,eyeY+eyeH+1,13,7); F(x,CHEEK,w-18,eyeY+eyeH+1,13,7); x.globalAlpha=1; // ほっぺ
    const cx=w>>1;
    F(x,adj(SKIN,-22),cx-1,eyeY+eyeH-1,2,2);                           // 鼻
    const my=eyeY+eyeH+9;                                              // 口
    if(spec.mouth==='にっこり'){ F(x,MOUTH,cx-5,my,10,2); F(x,MOUTH,cx-6,my-2,2,2); F(x,MOUTH,cx+5,my-2,2,2); }
    else if(spec.mouth==='への字'){ F(x,MOUTH,cx-5,my,10,2); F(x,MOUTH,cx-6,my+2,2,2); F(x,MOUTH,cx+5,my+2,2,2); }
    else { F(x,MOUTH,cx-2,my,4,3); }
  }
  function paintSide(x,w,h){
    F(x,SKIN,0,0,w,h); F(x,adj(SKIN,-12),0,Math.floor(h*0.5),w,Math.ceil(h*0.5)); // 下半分やや陰
    if(HP.none){ F(x,HAIR,0,0,w,3); return; }
    F(x,HAIR,0,0,w, HP.side?Math.floor(h*0.74):Math.floor(h*0.34));
  }
  const paintTop=(x,w,h)=>{ F(x,HAIR,0,0,w,h); F(x,adj(HAIR,15),Math.floor(w*0.3),Math.floor(h*0.25),Math.floor(w*0.4),Math.floor(h*0.3)); };
  const paintBottom=(x,w,h)=>F(x,adj(SKIN,-18),0,0,w,h);
  function paintBack(x,w,h){ if(HP.back){ F(x,HAIR,0,0,w,h); F(x,adj(HAIR,-12),0,Math.floor(h*0.6),w,Math.ceil(h*0.4)); } else { F(x,SKIN,0,0,w,h); F(x,HAIR,0,0,w,3); } }

  const headMats=[ mk(paintSide,32,32), mk(paintSide,32,32), mk(paintTop,32,32),
                   mk(paintBottom,32,32), mk(paintFront,64,64), mk(paintBack,32,32) ];
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.6), headMats);
  head.position.y=2.1; head.castShadow=true; g.add(head);

  /* ===== 胴（凝ったシャツ＋長い髪の垂らし） ===== */
  const drape=(base,frac)=>mk((x,w,h)=>{ F(x,base,0,0,w,h); F(x,adj(base,-15),0,h-2,w,2); if(frac>0) F(x,HAIR,0,0,w,Math.floor(h*frac)); },16,24);
  function shirtFront(x,w,h){
    F(x,CLO,0,0,w,h);
    F(x,'#ffffff',Math.floor(w*0.31),0,Math.floor(w*0.38),3);          // 襟
    F(x,adj(CLO,-18),(w>>1),3,1,h-5);                                  // 中央の縫い目
    F(x,adj(CLO,30),(w>>1),6,1,1); F(x,adj(CLO,30),(w>>1),11,1,1); F(x,adj(CLO,30),(w>>1),16,1,1); // ボタン
    F(x,adj(CLO,16),1,4,2,h-6); F(x,adj(CLO,-18),w-2,4,1,h-6);         // 明暗の側面
    F(x,adj(CLO,-20),0,h-2,w,2);                                       // 裾
  }
  const sideFrac = HP.side? HP.body*0.7 : 0;
  const bodyMats=[ drape(CLO,sideFrac), drape(CLO,sideFrac), solid(CLO), solid(CLO),
                   mk(shirtFront,16,24), drape(CLO,HP.body) ];
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.9,0.3), bodyMats);
  body.position.y=1.35; body.castShadow=true; g.add(body);

  /* ===== 腕（肩を支点に振れるよう pivot 化） ===== */
  const armFace=()=>mk((x,w,h)=>{ F(x,CLO,0,0,w,h); F(x,adj(CLO,-25),0,Math.floor(h*0.60),w,2);
    F(x,SKIN,0,Math.floor(h*0.66),w,Math.ceil(h*0.34)); F(x,adj(SKIN,-16),0,h-2,w,2); },8,24);
  const armPivots=[];
  function arm(sx){
    const piv=new THREE.Group(); piv.position.set(sx,1.8,0);            // 肩
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.9,0.3),
      [armFace(),armFace(),solid(CLO),solid(SKIN),armFace(),armFace()]);
    m.position.y=-0.45; m.castShadow=true; piv.add(m); g.add(piv); armPivots.push(piv);
  }
  arm(-0.45); arm(0.45);

  /* ===== 脚（股関節を支点に振れるよう pivot 化／ズボン・スカート＋靴） ===== */
  const legTop = isSkirt? SKIN : BOT;
  const legFace=()=>mk((x,w,h)=>{ F(x,legTop,0,0,w,h); F(x,adj(legTop,-22),0,0,1,Math.floor(h*0.82));
    F(x,SHOE,0,Math.floor(h*0.82),w,Math.ceil(h*0.18)); F(x,adj(SHOE,-28),0,Math.floor(h*0.82),w,1); },8,24);
  const legPivots=[];
  function leg(sx){
    const piv=new THREE.Group(); piv.position.set(sx,0.9,0);            // 股関節
    const m=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.9,0.3),
      [legFace(),legFace(),solid(legTop),solid(SHOE),legFace(),legFace()]);
    m.position.y=-0.45; m.castShadow=true; piv.add(m); g.add(piv); legPivots.push(piv);
  }
  leg(-0.15); leg(0.15);

  if(isSkirt){
    const skirt=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.4,0.42),
      mk((x,w,h)=>{ F(x,BOT,0,0,w,h); F(x,adj(BOT,-18),0,h-2,w,2); F(x,adj(BOT,14),0,0,w,2); },16,8));
    skirt.position.y=0.85; skirt.castShadow=true; g.add(skirt);
  }

  g.userData.spec = spec; g.userData.armPivots=armPivots; g.userData.legPivots=legPivots;
  return g;
}

/* ---------- 住人の徘徊AI ---------- */
const WANDER_SPEED = 0.85;   // 歩く速さ（ユニット/秒）
function lerpAngle(a,b,t){ let d=b-a; while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
function faceTo(m,ox,oz){ m.rotation.y = Math.atan2(ox-m.position.x, oz-m.position.z); }
function pickWanderTarget(cur){
  for(let i=0;i<12;i++){
    const a=Math.random()*Math.PI*2, dist=1.5+Math.random()*3.5;
    const x=cur.x+Math.cos(a)*dist, z=cur.z+Math.sin(a)*dist;
    if(Math.hypot(x,z)>ISLAND_R-1.0) continue;                                  // 島の外に出ない
    if(state.buildings.some(b=>Math.hypot(b.pos.x-x,b.pos.z-z)<1.2)) continue;  // 建物に重ならない
    return {x,z};
  }
  return {x:cur.x*0.6, z:cur.z*0.6};   // だめなら中心寄りへ
}
function setLimbSwing(m,a){
  const u=m.userData;
  if(u.legPivots){ u.legPivots[0].rotation.x=a; u.legPivots[1].rotation.x=-a; }
  if(u.armPivots){ u.armPivots[0].rotation.x=-a*0.8; u.armPivots[1].rotation.x=a*0.8; }
}
function updateWander(dt){
  dt=Math.min(dt,0.05);                // タブ復帰時などの大ジャンプ防止
  const now=performance.now();
  for(const m of residentMeshes){
    if(m===dragging) continue;         // ドラッグ中の住人は動かさない
    const r=m.userData.resident;
    let w=m.userData.wander;
    if(!w){ w=m.userData.wander={target:{x:r.pos.x,z:r.pos.z}, pause:Math.random()*2.5}; }
    let moving=false;
    const busy = m.userData.busyUntil && now<m.userData.busyUntil;
    if(busy){ /* 会話中は静止 */ }
    else if(w.pause>0){ w.pause-=dt; }                                  // 休憩中
    else {
      const dx=w.target.x-m.position.x, dz=w.target.z-m.position.z, d=Math.hypot(dx,dz);
      if(d<0.15){ w.pause=1.0+Math.random()*3.0; w.target=pickWanderTarget(m.position); } // 到着
      else {
        const step=Math.min(d, WANDER_SPEED*dt);
        m.position.x+=dx/d*step; m.position.z+=dz/d*step;
        r.pos.x=m.position.x; r.pos.z=m.position.z;                     // 保存用に同期
        m.rotation.y = lerpAngle(m.rotation.y, Math.atan2(dx,dz), Math.min(1,dt*8)); // 進行方向
        m.userData.walk=(m.userData.walk||0)+step*6.5;                 // 歩行位相
        moving=true;
      }
    }
    m.position.y=0.5;
    const tgt = moving ? Math.sin(m.userData.walk||0)*0.55 : 0;        // 脚・腕の振り
    m.userData.swing = (m.userData.swing||0) + (tgt-(m.userData.swing||0))*Math.min(1,dt*12);
    setLimbSwing(m, m.userData.swing);
  }
}

function clearMeshes(arr){ arr.forEach(m=>{ islandGroup.remove(m); if(m.userData.badgeEl){ m.userData.badgeEl.remove(); m.userData.badgeEl=null; } }); arr.length=0; }

/* 食べ物屋(shopFood)/服屋(shopCloth)の3Dモデル。家とは別シルエット。

/* ---------- 入力処理（タップ/ドラッグ） ---------- */
function setupIslandInput(){
  const el = renderer.domElement;
  let pointerDownPos=null, movedFar=false;

  el.addEventListener('pointerdown', e=>{
    pointerDownPos={x:e.clientX,y:e.clientY}; movedFar=false;
    if(curMode==='move'){
      const hit = pickResident(e);
      if(hit){ dragging=hit.mesh; }
    }
  });
  el.addEventListener('pointermove', e=>{
    if(pointerDownPos){
      const d=Math.hypot(e.clientX-pointerDownPos.x,e.clientY-pointerDownPos.y);
      if(d>8) movedFar=true;
    }
    if(dragging){
      const p = pickGround(e);
      if(p){
        // 島の範囲内にクランプ
        const r=Math.hypot(p.x,p.z); const lim=ISLAND_R-0.6;
        if(r>lim){ p.x=p.x/r*lim; p.z=p.z/r*lim; }
        dragging.position.x=p.x; dragging.position.z=p.z;
        const res=dragging.userData.resident; res.pos.x=p.x; res.pos.z=p.z;
      }
    }
  });
  el.addEventListener('pointerup', e=>{
    const wasDragging = dragging;
    dragging = null;
    // 実際にドラッグして動かした場合のみ「移動」として確定し、タップ処理はしない
    if(wasDragging && movedFar){
      // ドロップ直後はその場で少し待機（すぐ歩き去らないように）
      wasDragging.userData.wander={target:{x:wasDragging.position.x,z:wasDragging.position.z}, pause:2.0};
      pointerDownPos=null; return;
    }
    // それ以外（住人を軽くタップ／地面タップ／建物タップ）はタップ処理へ
    if(!movedFar){ handleTap(e); }
    pointerDownPos=null;
  });
  el.addEventListener('pointercancel', ()=>{ dragging=null; pointerDownPos=null; });
}
function screenToNDC(e){
  pointer.x = (e.clientX/window.innerWidth)*2-1;
  pointer.y = -(e.clientY/window.innerHeight)*2+1;
}
function pickGround(e){
  screenToNDC(e); raycaster.setFromCamera(pointer,camera);
  const ground = islandGroup.children.find(c=>c.name==='ground');
  const hits = raycaster.intersectObject(ground,true);
  if(hits.length){ const p=hits[0].point; return {x:p.x,z:p.z}; }
  return null;
}
function pickResident(e){
  screenToNDC(e); raycaster.setFromCamera(pointer,camera);
  const hits = raycaster.intersectObjects(residentMeshes,true);
  if(hits.length){
    let o=hits[0].object; while(o && !o.userData.resident) o=o.parent;
    if(o) return {mesh:o};
  }
  return null;
}
function pickBuilding(e){
  screenToNDC(e); raycaster.setFromCamera(pointer,camera);
  const hits = raycaster.intersectObjects(buildingMeshes,true);
  if(hits.length){ let o=hits[0].object; while(o&&!o.userData.building) o=o.parent; if(o) return o; }
  return null;
}
function tooClose(x,z){
  const all=[...state.residents.map(r=>r.pos),...state.buildings.map(b=>b.pos)];
  return all.some(p=>Math.hypot(p.x-x,p.z-z)<1.4);
}
function handleTap(e){
  if(curMode==='move'){
    const r=pickResident(e);
    if(r){ window.DOPA.core.openCare(r.mesh.userData.resident); return; }
    const b=pickBuilding(e);
    if(b){
      const t=b.userData.building.type;
      if(t==='house'){ window.DOPA.core.openHouse(); return; }
      if(t==='shopFood'||t==='shop'){ toast("🍔 おいしそうな匂いがする…"); return; }
      if(t==='shopCloth'){ toast("👕 すてきな服が並んでいる！"); return; }
      if(t==='present'){ toast("🎁 すてきなプレゼントが並んでいる！"); return; }
    }
    return;
  }
  if(curMode==='tree'||curMode==='house'||curMode==='shopFood'||curMode==='shopCloth'||curMode==='present'){
    const p=pickGround(e); if(!p) return;
    const r=Math.hypot(p.x,p.z); if(r>ISLAND_R-0.8){ toast("島の上に置いてね"); return; }
    if(tooClose(p.x,p.z)){ toast("近すぎるよ。別の場所に！"); return; }
    if(curMode==='tree'){ state.buildings.push({type:'tree',pos:{x:p.x,z:p.z}}); }
    else if(curMode==='house'){ state.buildings.push({type:'house',pos:{x:p.x,z:p.z}}); }
    else if(curMode==='shopFood'){ state.buildings.push({type:'shopFood',pos:{x:p.x,z:p.z}}); toast("食べ物屋を置いた！"); }
    else if(curMode==='shopCloth'){ state.buildings.push({type:'shopCloth',pos:{x:p.x,z:p.z}}); toast("服屋を置いた！"); }
    else if(curMode==='present'){ state.buildings.push({type:'present',pos:{x:p.x,z:p.z}}); toast("プレゼント屋を置いた！"); }
    hideHint(); setMode('move');
    rebuildIsland();
  }
}

/* ---------- カメラ操作（スティック・ズーム） ---------- */
function setupCamStick(){
  const stick=$('#camStick'), knob=$('#camKnob');
  let active=false, cx=0, cy=0;
  function start(e){ active=true; const r=stick.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; move(e); }
  function move(e){
    if(!active) return;
    const t=e.touches?e.touches[0]:e;
    let dx=t.clientX-cx, dy=t.clientY-cy;
    const max=44, d=Math.hypot(dx,dy); if(d>max){ dx=dx/d*max; dy=dy/d*max; }
    knob.style.transform=`translate(${dx}px,${dy}px)`;
    camTargetAngle += dx*0.0009;     // 左右で回転
    camTargetDist = Math.max(9,Math.min(32, camTargetDist + dy*0.02)); // 上下で寄り引き
  }
  function end(){ active=false; knob.style.transform='translate(0,0)'; }
  stick.addEventListener('touchstart',start,{passive:true});
  stick.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
  stick.addEventListener('touchend',end);
  stick.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  $('#zoomIn').onclick=()=>{ camTargetDist=Math.max(9,camTargetDist-2); };
  $('#zoomOut').onclick=()=>{ camTargetDist=Math.min(32,camTargetDist+2); };
}

/* ---------- 会話システム ---------- */
let bubbles=[]; // {el, mesh, until}
let convoCooldown=0;
function updateConversations(dt){
  convoCooldown-=dt;
  // 期限切れ吹き出し削除
  bubbles=bubbles.filter(b=>{ if(performance.now()>b.until){ b.el.remove(); return false;} return true; });
  if(convoCooldown>0) return;
  // 近い2人を探す
  for(let i=0;i<residentMeshes.length;i++){
    for(let j=i+1;j<residentMeshes.length;j++){
      const a=residentMeshes[i],b=residentMeshes[j];
      const d=a.position.distanceTo(b.position);
      if(d<2.2){
        startConvo(a,b); convoCooldown=6; return;
      }
    }
  }
}
function mbtiLine(mbti){
  const E=mbti[0]==='E', N=mbti[1]==='N', F=mbti[2]==='F', P=mbti[3]==='P';
  const pool=[];
  pool.push(E?"やっほー！元気？":"…こんにちは。");
  pool.push(N?"面白いこと考えついたんだ！":"今日もいつも通りだね。");
  pool.push(F?"あなたと話せて嬉しいな":"効率よく進めよう。");
  pool.push(P?"なんか楽しいことしよ！":"ちゃんと計画立てた？");
  return pool[Math.floor(Math.random()*pool.length)];
}
function startConvo(a,b){
  const now=performance.now();
  a.userData.busyUntil=now+2600; b.userData.busyUntil=now+2600;            // 会話中は立ち止まる
  faceTo(a,b.position.x,b.position.z); faceTo(b,a.position.x,a.position.z); // 向き合う
  showMark(a,'❗'); showMark(b,'❗');
  setTimeout(()=>{ showBubble(a, mbtiLine(a.userData.resident.spec.mbti||"ENFP")); },300);
  setTimeout(()=>{ showBubble(b, mbtiLine(b.userData.resident.spec.mbti||"ISTJ")); },1100);
}
function showBubble(mesh,text){
  const el=document.createElement('div'); el.className='bubble'; el.textContent=text;
  bubbleLayer.appendChild(el);
  bubbles.push({el,mesh,until:performance.now()+2600,kind:'bubble'});
}
function showMark(mesh,txt){
  const el=document.createElement('div'); el.className='mark'; el.textContent=txt;
  bubbleLayer.appendChild(el);
  bubbles.push({el,mesh,until:performance.now()+1000,kind:'mark'});
}
function updateBubblePositions(){
  if(!bubbles.length) return;
  const v=new THREE.Vector3();
  bubbles.forEach(b=>{
    v.copy(b.mesh.position); v.y += (b.kind==='mark'?3.0:2.6);
    v.project(camera);
    const x=(v.x*0.5+0.5)*window.innerWidth;
    const y=(-v.y*0.5+0.5)*window.innerHeight;
    b.el.style.left=x+'px'; b.el.style.top=y+'px';
    b.el.style.display=(v.z<1)?'block':'none';
  });
}
/* 頭上レベルバッジの追従 */
function updateBadges(){
  if(!residentMeshes.length) return;
  const v=new THREE.Vector3();
  for(const m of residentMeshes){
    const el=m.userData.badgeEl; if(!el) continue;
    v.copy(m.position); v.y += 2.25; v.project(camera);

    el.style.top =((-v.y*0.5+0.5)*window.innerHeight)+'px';

  }
}

function createStage(container, opt={}){
  const scene=new THREE.Scene();
  const cam=new THREE.PerspectiveCamera(38,1,0.1,100);
  cam.position.set(opt.cx??0, opt.cy??1.7, opt.cz??4.6);
  cam.lookAt(new THREE.Vector3(0, opt.ty??1.45, 0));
  const rdr=new THREE.WebGLRenderer({antialias:true,alpha:true});
  rdr.setPixelRatio(Math.min(devicePixelRatio,2));
  rdr.shadowMap.enabled=true;
  container.appendChild(rdr.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.95));
  const dir=new THREE.DirectionalLight(0xffffff,0.8); dir.position.set(3,6,4); scene.add(dir);
  let charGroup=null, visible=false, autoRot=opt.autoRot!==false;
  function size(){
    const w=container.clientWidth||window.innerWidth,
          h=container.clientHeight||Math.round(window.innerHeight*0.46);
    cam.aspect=w/h; cam.updateProjectionMatrix(); rdr.setSize(w,h);
  }
  function loop(){
    requestAnimationFrame(loop);
    if(!visible) return;
    if(charGroup&&autoRot) charGroup.rotation.y+=0.012;
    rdr.render(scene,cam);
  }
  loop();
  return {
    scene,cam,rdr,
    set(g){ if(charGroup) scene.remove(charGroup); charGroup=g; if(g){ g.position.y=0; scene.add(g);} },
    add(o){ scene.add(o); },
    show(v){ visible=v; if(v) size(); },
    size, get group(){return charGroup;}, _people:null
  };
}

function findFreeSpot(){
  for(let i=0;i<40;i++){
    const a=Math.random()*Math.PI*2, r=Math.random()*9;

    if(!occ.some(p=>Math.hypot(p.x-x,p.z-z)<1.4)) return {x,z};
  }
  return {x:(Math.random()-0.5)*4, z:(Math.random()-0.5)*4};
}
function confirmMaker(){
  if(!makerSpec.name||!makerSpec.name.trim()) makerSpec.name="ドパガキ";
  if(!makerSpec.mbti) makerSpec.mbti="ENFP";
  const res={
    spec:Object.assign({},makerSpec),
    happy:20, level:1, pos:findFreeSpot(),
    favFood:FOODS[Math.floor(Math.random()*FOODS.length)].id,
    clothId:null, maxedOnce:false
  };
  S.residents.push(res);
  if(makerStage) makerStage.show(false);
  const had2=S.clothUnlocked, had3=S.presentUnlocked;
  if(S.residents.length>=2) S.clothUnlocked=true;
  if(S.residents.length>=3) S.presentUnlocked=true;
  let unlockMsg='';
  if(!had2 && S.clothUnlocked) unlockMsg='👕 服屋が解禁！（店から置けるよ）';
  if(!had3 && S.presentUnlocked) unlockMsg='🎁 プレゼント屋が解禁！（店から置けるよ）';
  ensureIsland();
  core.rebuildIsland();
  showScreen('islandScreen');
  toast(unlockMsg || (res.spec.name+" が島にやってきた！"));
  autosave();
}

/* =========================================================
   MBTI 簡易診断（8問）
   ========================================================= */
const DIAG=[
  {q:"休みの日、どっちが好き？", a:"友だちとワイワイ", b:"ひとりでまったり", aL:'E', bL:'I'},
  {q:"初対面の人と話すのは？", a:"楽しい！", b:"ちょっと疲れる", aL:'E', bL:'I'},
  {q:"アイデアを考えるとき", a:"ひらめき重視", b:"現実的に考える", aL:'N', bL:'S'},
  {q:"よく話すのは", a:"未来や空想の話", b:"今ある事実の話", aL:'N', bL:'S'},
  {q:"決めるときは", a:"気持ちを大事に", b:"スジを大事に", aL:'F', bL:'T'},
  {q:"友だちが落ち込んでたら", a:"まず共感する", b:"解決策を出す", aL:'F', bL:'T'},
  {q:"予定の立て方は", a:"その時の気分で", b:"きっちり計画", aL:'P', bL:'J'},
  {q:"部屋はどっち？", a:"わりと散らかってる", b:"いつも整理整頓", aL:'P', bL:'J'},
];
let diagIdx=0, diagScore={};
function startDiag(){
  diagIdx=0; diagScore={E:0,I:0,N:0,S:0,F:0,T:0,P:0,J:0};
  $('#diagModal').classList.add('show'); showDiagQ();
}
function showDiagQ(){
  const d=DIAG[diagIdx];
  $('#diagQ').textContent=d.q; $('#diagA').textContent=d.a; $('#diagB').textContent=d.b;
  $('#diagProg').textContent=(diagIdx+1)+' / '+DIAG.length;
}
function answerDiag(pick){
  const d=DIAG[diagIdx];
  diagScore[pick==='a'?d.aL:d.bL]++;
  diagIdx++;
  if(diagIdx<DIAG.length){ showDiagQ(); }
  else{
    const m=(diagScore.E>=diagScore.I?'E':'I')+(diagScore.N>=diagScore.S?'N':'S')+
            (diagScore.F>=diagScore.T?'F':'T')+(diagScore.P>=diagScore.J?'P':'J');
    $('#diagModal').classList.remove('show');
    setMbti(m); toast("診断結果：" + m + "！");
  }
}

/* =========================================================
   住人ケア画面（食べ物・服）
   ========================================================= */
let careRes=null, careTab='food';
function careCharGroup(res){
  const spec=Object.assign({},res.spec);
  if(res.clothId!=null){ const c=CLOTHES.find(c=>c.id===res.clothId); if(c) spec.clothes=c.color; }
  spec._level = res.level||1;
  return buildCharacter(THREE, spec);
}
/* ---------- レベル ---------- */
function levelTitle(lv){
  if(lv>=10) return 'でんせつのドパガキ';
  if(lv>=7)  return '島のカリスマ';
  if(lv>=5)  return '島のスター';
  if(lv>=3)  return 'しんゆう';
  if(lv>=2)  return 'なかよし';
  return 'かけだし';
}
// 幸せを加算。100到達ごとにレベルアップ（超過分は繰り越し）。{leveled,reward,newLevel} を返す
function addHappy(res, amount){
  res.level = res.level||1;
  res.happy = (res.happy||0) + amount;
  let leveled=0, reward=0;
  while(res.happy>=100){
    res.happy-=100; res.level++; leveled++;
    reward += 100*res.level;   // レベルが上がるほどお祝い金UP
  }
  if(leveled){ S.gold += reward; }
  return {leveled, reward, newLevel:res.level};
}
function refreshCareTitle(res){
  const lv=res.level||1;
  $('#careName').textContent = `${res.spec.name} Lv.${lv}`;
}
function lvBurst(text){
  const b=$('#lvBurst'); b.querySelector('.b').innerHTML=text;
  b.style.display='flex'; setTimeout(()=>b.style.display='none',1100);
}
function onLevelUp(res, up){
  const t=levelTitle(up.newLevel);
  lvBurst(`🎉 Lv.${up.newLevel} にレベルアップ！<br>「${t}」 ＋${up.reward}G`);
  $('#careMsg').textContent = `🎉 Lv.${up.newLevel}「${t}」になった！ お祝い金 ＋${up.reward}G`;
  refreshCareTitle(res);
  if(careStage) careStage.set(careCharGroup(res));  // 王冠などの見た目を即反映
}
function el(tag,cls){ const d=document.createElement(tag); if(cls) d.className=cls; return d; }
function openCare(res){
  careRes=res; careTab='food'; res.level=res.level||1;
  refreshCareTitle(res);
  updateHappy(); $('#careMsg').textContent=`「${levelTitle(res.level)}」 何をあげる？`;
  $$('.care-tab').forEach(t=>t.classList.toggle('sel',t.dataset.tab==='food'));
  buildCareGrid();
  showScreen('careScreen');
  if(!careStage) careStage=createStage($('#carePreviewWrap'),{cy:1.65,cz:5.2,ty:1.2});
  careStage.show(true); careStage.set(careCharGroup(res));
}
function updateHappy(){
  const h=Math.round(careRes.happy);
  $('#happyNum').textContent=h; $('#happyFill').style.width=h+'%';
}
function buildCareGrid(){
  const grid=$('#careGrid'); grid.innerHTML='';
  if(careTab==='food'){
    FOODS.forEach(f=>{
      const it=el('div','shop-item');
      it.innerHTML=`<div class="img">${f.emo}</div><div class="nm">${f.name}</div>
        <div class="pr"><span class="mini-coin"></span>${f.price}</div>`;
      it.onclick=()=>giveFood(f); grid.appendChild(it);
    });
  } else if(careTab==='cloth'){
    if(!S.clothUnlocked){
      grid.innerHTML='<div style="grid-column:1/5;text-align:center;font-weight:800;color:#888;padding:20px;">2人目を島に呼ぶと<br>服が開放されるよ！</div>';
      return;
    }
    CLOTHES.forEach(c=>{
      const it=el('div','shop-item');
      const owned = careRes.clothId===c.id;
      it.innerHTML=`<div class="img"><span style="display:inline-block;width:30px;height:30px;border-radius:8px;border:2px solid #ccc;background:${swHTML(c.color)}"></span></div>
        <div class="nm">${c.name}${owned?' ✓':''}</div>
        <div class="pr"><span class="mini-coin"></span>${c.price}</div>`;
      it.onclick=()=>giveCloth(c); grid.appendChild(it);
    });
  }
  else { // プレゼント
    if(!S.presentUnlocked){
      grid.innerHTML='<div style="grid-column:1/5;text-align:center;font-weight:800;color:#888;padding:20px;">3人目を島に呼ぶと<br>プレゼントが解禁されるよ！</div>';
      return;
    }
    PRESENTS.forEach(pp=>{
      const it=el('div','shop-item');
      it.innerHTML=`<div class="img">${pp.emo}</div><div class="nm">${pp.name}</div>
        <div class="pr"><span class="mini-coin"></span>${pp.price}</div>`;
      it.onclick=()=>givePresent(pp); grid.appendChild(it);
    });
  }
}
function reaction(res, kind){
  const m=res.spec.mbti||'ENFP'; const E=m[0]==='E',F=m[2]==='F';
  if(kind==='love') return (E?"わーい！":"")+(F?"だいすき！ありがとう！":"これは良い。満足だ。");
  if(kind==='ok')   return (E?"おいしいね！":"うん、悪くない。");
  if(kind==='cloth')return (F?"似合うかな？うれしい！":"機能的でいい服だ。");
  return "ありがとう。";
}
function giveFood(f){
  if(S.gold<f.price){ toast("Gが足りないよ！"); return; }
  S.gold-=f.price;
  const fav=(careRes.favFood===f.id); let tip, gain;
  if(fav){ gain=20; tip=f.price;                  $('#careMsg').textContent="🥰 "+reaction(careRes,'love'); }
  else   { gain=9;  tip=Math.floor(f.price*0.5);  $('#careMsg').textContent="😋 "+reaction(careRes,'ok'); }
  S.gold += Math.round(tip*(1+0.1*((careRes.level||1)-1)));  // 高レベルほどチップ収入UP
  const up=addHappy(careRes, gain);
  if(up.leveled) onLevelUp(careRes, up);
  updateHappy(); core.refreshHUD(); autosave();
}
function giveCloth(c){
  if(careRes.clothId===c.id){ toast("もう着ているよ"); return; }
  if(S.gold<c.price){ toast("Gが足りないよ！"); return; }
  S.gold-=c.price; careRes.clothId=c.id;
  $('#careMsg').textContent="👕 "+reaction(careRes,'cloth');
  careStage.set(careCharGroup(careRes));
  const up=addHappy(careRes, 10);
  if(up.leveled) onLevelUp(careRes, up);
  updateHappy(); core.refreshHUD(); buildCareGrid(); autosave();
}
function givePresent(p){
  if(S.gold<p.price){ toast("Gが足りないよ！"); return; }
  S.gold-=p.price;
  const mbti=careRes.spec.mbti||'';
  const match = mbti.indexOf(p.trait)>=0;
  let gain;
  if(match){ gain=25; const reward=p.price*2; S.gold+=reward;
    $('#careMsg').textContent=`🎁 ${reaction(careRes,'love')}（好みドンピシャ！ ＋${reward}G）`; }
  else { gain=6; $('#careMsg').textContent=`🎁 ${reaction(careRes,'ok')}（好みではなかったみたい…）`; }
  const up=addHappy(careRes, gain);
  if(up.leveled) onLevelUp(careRes, up);
  updateHappy(); core.refreshHUD(); autosave();
}
function closeCare(){
  if(careStage) careStage.show(false);
  core.rebuildIsland(); showScreen('islandScreen'); saveGame(false);
}

/* =========================================================
   家の中
   ========================================================= */
function buildHouseScene(stage){
  const floor=new THREE.Mesh(new THREE.BoxGeometry(8,0.3,8),
    new THREE.MeshStandardMaterial({color:0xb98a5e})); floor.position.y=-0.15; stage.add(floor);
  const wallMat=new THREE.MeshStandardMaterial({color:0xf3e3c8});
  const back=new THREE.Mesh(new THREE.BoxGeometry(8,5,0.3),wallMat); back.position.set(0,2,-4); stage.add(back);
  const left=new THREE.Mesh(new THREE.BoxGeometry(0.3,5,8),wallMat); left.position.set(-4,2,0); stage.add(left);
  const win=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.4,0.1),
    new THREE.MeshStandardMaterial({color:0x9fd8ff})); win.position.set(0,2.4,-3.83); stage.add(win);
  const rug=new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.05,28),
    new THREE.MeshStandardMaterial({color:0xff9aa6})); rug.position.y=0.03; stage.add(rug);
  const tbl=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.7,0.15,16),
    new THREE.MeshStandardMaterial({color:0x8a5a2b})); tbl.position.set(0,0.55,0); stage.add(tbl);
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.5,10),
    new THREE.MeshStandardMaterial({color:0x6e4322})); leg.position.set(0,0.25,0); stage.add(leg);
}
let houseBuilt=false;
function openHouse(){
  if(!houseStage){ houseStage=createStage($('#houseInner'),{cx:0,cy:3.4,cz:7.5,ty:1.3,autoRot:false}); }
  if(!houseBuilt){ buildHouseScene(houseStage); houseBuilt=true; }
  if(houseStage._people){ houseStage._people.forEach(p=>houseStage.scene.remove(p)); }
  houseStage._people=[];
  const list=S.residents.slice(0,4);
  list.forEach((r,i)=>{
    const g=careCharGroup(r); g.scale.set(0.8,0.8,0.8);
    const x=(i-(list.length-1)/2)*1.5; g.position.set(x,0, i%2?0.4:-0.2);
    g.rotation.y=0.2*(i-1);
    houseStage.scene.add(g); houseStage._people.push(g);
  });
  showScreen('houseScreen'); houseStage.show(true);
}
function closeHouse(){ if(houseStage) houseStage.show(false); showScreen('islandScreen'); }

/* =========================================================
   セーブ／ロード
   - Claude上：window.storage（アーティファクト永続ストレージ）に保存
   - 外部公開時：localStorage に自動フォールバック
   ========================================================= */
function hasCloud(){ return !!(window.storage && window.storage.get && window.storage.set); }

async function writeRaw(data){
  if(hasCloud()){
    try{ await window.storage.set(SAVE_KEY, data, false); return true; }catch(e){}
  }
  try{ localStorage.setItem(SAVE_KEY, data); return true; }catch(e){}
  return false;
}
async function readRaw(){
  if(hasCloud()){
    try{ const r=await window.storage.get(SAVE_KEY, false); if(r && r.value!=null) return r.value; }
    catch(e){ /* 未保存キーは例外になる場合がある→無視 */ }
  }
  try{ return localStorage.getItem(SAVE_KEY); }catch(e){ return null; }
}

async function saveGame(showFx){
  const ok = await writeRaw(JSON.stringify(S));
  if(showFx){
    const b=$('#saveBurst');
    b.querySelector('.b').textContent = ok ? "💾 保存しました！" : "⚠ 保存できませんでした";
    b.style.display='flex'; setTimeout(()=>b.style.display='none',900);
  }
  return ok;
}
// 連続操作（食事・着替え等）はまとめて遅延保存
let _saveTimer=null;
function autosave(){ if(_saveTimer) clearTimeout(_saveTimer); _saveTimer=setTimeout(()=>{ saveGame(false); }, 700); }

async function hasSave(){ const raw=await readRaw(); return !!raw; }

async function loadGame(){
  const raw = await readRaw(); if(!raw) return false;
  try{
    const obj=JSON.parse(raw);
    S.islandName=obj.islandName||""; S.islandYomi=obj.islandYomi||"しま";
    S.gold=obj.gold??1000; S.clothUnlocked=!!obj.clothUnlocked; S.presentUnlocked=!!obj.presentUnlocked;
    S.residents.length=0; (obj.residents||[]).forEach(r=>{ if(r.level==null) r.level=1; S.residents.push(r); });
    S.buildings.length=0; (obj.buildings||[]).forEach(b=>S.buildings.push(b));
    return true;
  }catch(e){ return false; }
}

/* =========================================================
   イベント結線・初期化
   ========================================================= */
function toggleShopMenu(){ $('#shopMenu').classList.toggle('show'); const sn=$('#shopNew'); if(sn) sn.style.display='none'; }
function hideShopMenu(){ $('#shopMenu').classList.remove('show'); }
function wire(){
  $('#decideIslandBtn').onclick=()=>{
    const nm=$('#islandNameInput').value.trim();
    if(!nm){ toast("島の名前を入れてね"); return; }
    S.islandName=nm; S.islandYomi=$('#islandYomi').value; S.gold=1000;
    ensureIsland(); core.rebuildIsland();
    openMaker(true);
  };
  $('#continueBtn').onclick=async ()=>{
    if(!await loadGame()){ toast("セーブデータが無いよ"); return; }
    ensureIsland(); core.rebuildIsland(); core.refreshHUD();
    showScreen('islandScreen');
  };
  $$('#toolbar .tool').forEach(t=>{
    t.onclick=()=>{
      const mode=t.dataset.mode;
      if(mode==='shop'){ toggleShopMenu(); return; }
      hideShopMenu();
      if(mode==='addResident'){ openMaker(false); return; }
      core.setMode(mode);
    };
  });
  $$('#shopMenu .shop-opt').forEach(o=>{
    o.onclick=()=>{
      const mode=o.dataset.mode;
      if(mode==='shopCloth' && !S.clothUnlocked){ toast("2人目を島に呼ぶと服屋が解禁！"); return; }
      if(mode==='present' && !S.presentUnlocked){ toast("3人目を島に呼ぶとプレゼント屋が解禁！"); return; }
      hideShopMenu(); core.setMode(mode);
    };
  });
  $('#shopCancel').onclick=hideShopMenu;
  $('#shopMenu').onclick=(e)=>{ if(e.target.id==='shopMenu') hideShopMenu(); };
  $('#saveBtn').onclick=()=>{ saveGame(true); };
  $('#quitBtn').onclick=()=>$('#quitModal').classList.add('show');
  $('#quitNo').onclick=()=>$('#quitModal').classList.remove('show');
  $('#quitYes').onclick=async ()=>{ await saveGame(false); $('#quitModal').classList.remove('show'); location.reload(); };
  $('#makerConfirm').onclick=confirmMaker;
  $('#makerCancel').onclick=()=>{ if(makerStage) makerStage.show(false); showScreen('islandScreen'); };
  $('#mbtiDiagBtn').onclick=startDiag;
  $('#diagA').onclick=()=>answerDiag('a');
  $('#diagB').onclick=()=>answerDiag('b');
  $('#careBack').onclick=closeCare;
  $$('.care-tab').forEach(t=>t.onclick=()=>{ careTab=t.dataset.tab;
    $$('.care-tab').forEach(x=>x.classList.toggle('sel',x===t)); buildCareGrid(); });
  $('#houseBack').onclick=closeHouse;
}

core.openCare=openCare;
core.openHouse=openHouse;

async function boot(){
  buildMakerUI();
  wire();
  $('#continueBtn').style.display = (await hasSave()) ? 'block':'none';
  showScreen('titleScreen');
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();

})();


</script>
